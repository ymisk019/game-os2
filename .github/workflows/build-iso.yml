name: Build Yazan OS ISO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 socat imagemagick

      - name: Host tests (exception stubs)
        run: make test

      - name: Build normal ISO
        run: |
          make iso && make check
          mkdir -p out
          cp build/yazanos.iso out/yazanos.iso

      - name: Build panic-test ISO (crashes on purpose with a page fault)
        run: |
          make clean && make iso FAULT=pf
          cp build/yazanos.iso out/yazanos-panic-test.iso

      - name: QEMU boot test - normal ISO
        continue-on-error: true
        run: bash scripts/qemu-test.sh out/yazanos.iso normal "Phase 2 complete" "KERNEL PANIC"

      - name: QEMU boot test - panic ISO
        continue-on-error: true
        run: bash scripts/qemu-test.sh out/yazanos-panic-test.iso panic "KERNEL PANIC" ""

      - name: Convert screenshots to PNG
        if: always()
        run: for f in out/*.ppm; do [ -f "$f" ] && convert "$f" "${f%.ppm}.png"; done; rm -f out/*.sock out/*.ppm; ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yazanos-iso
          path: out/
